<!doctype html>
<html lang="zh-TW" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Threads Downloader — 公開媒體研究工具</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="以安全、同源的瀏覽器流程處理公開 Threads 貼文影片版本。僅供技術及學術研究使用。"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
  </head>
  <body>
    <app-root></app-root>
    <script>
      (function () {
        if (!('modelContext' in navigator) || navigator.modelContext === null) {
          return;
        }

        navigator.modelContext
          .registerTool({
            name: 'threads_health',
            description: 'Get Threads Downloader service health status.',
            inputSchema: {
              type: 'object',
              properties: {},
              required: [],
            },
            execute: async () => {
              const response = await fetch('/api/health');
              return response.json();
            },
          })
          .catch(() => {});
      })();
    </script>
  </body>
</html>
