name: Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
      - name: Remove Gitleaks runner report
        if: always()
        run: rm -f -- results.sarif
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=low
      - name: Check formatting
        run: npm run format:check
      - name: Lint source
        run: npm run lint
      - name: Type-check workspaces
        run: npm run typecheck
      - name: Run Angular, Worker, contracts, and security scripts unit coverage
        run: npm run coverage
      - name: Run Durable Object integration tests
        run: npm run test:do
      - name: Run explicit HTTP range contract tests
        run: npm run test:range
      - name: Run security and CI policy tests
        run: npm run test:security
      - name: Install locked Playwright browser
        run: npm exec playwright install --with-deps chromium
      - name: Run mocked downloader end-to-end tests
        run: npm run test:e2e
      - name: Run accessibility tests
        run: npm run test:accessibility
      - name: Build Angular production bundle
        run: npm run build:web
      - name: Scan browser bundle for secrets
        run: npm run security:bundle
      - name: Verify Wrangler production exposure
        run: npm run security:wrangler
      - name: Build Worker with Wrangler dry run
        run: npm run worker:dry-run
      - name: Upload web LCOV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-web-${{ github.sha }}
          path: coverage/web/lcov.info
          if-no-files-found: error
          retention-days: 7
      - name: Upload Worker LCOV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-worker-${{ github.sha }}
          path: coverage/worker/lcov.info
          if-no-files-found: error
          retention-days: 7
      - name: Upload contracts LCOV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-contracts-${{ github.sha }}
          path: coverage/contracts/lcov.info
          if-no-files-found: error
          retention-days: 7
      - name: Upload security scripts LCOV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-scripts-${{ github.sha }}
          path: coverage/scripts/lcov.info
          if-no-files-found: error
          retention-days: 7

  sonar:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Download web LCOV
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lcov-web-${{ github.sha }}
          path: coverage/web
      - name: Download Worker LCOV
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lcov-worker-${{ github.sha }}
          path: coverage/worker
      - name: Download contracts LCOV
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lcov-contracts-${{ github.sha }}
          path: coverage/contracts
      - name: Download security scripts LCOV
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lcov-scripts-${{ github.sha }}
          path: coverage/scripts
      - name: Scan with SonarQube Cloud and wait for Quality Gate
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
      - name: Verify exact Sonar analysis and zero open findings
        run: npm run security:sonar

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [verify, sonar]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://threads.pylot.dev
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build Angular production bundle
        run: npm run build:web
      - name: Scan browser bundle for secrets
        run: npm run security:bundle
      - name: Verify Wrangler production exposure
        run: npm run security:wrangler
      - name: Require approved legal production marker
        run: npm run security:deploy-ready
      - name: Require current remote main revision
        shell: bash
        run: |
          remote_main_ref="$(git ls-remote --exit-code origin refs/heads/main 2>/dev/null)" || {
            printf '%s\n' 'DEPLOY_REMOTE_MAIN_LOOKUP_FAILED' >&2
            exit 1
          }
          expected_main_ref="${GITHUB_SHA}"$'\trefs/heads/main'
          if [[ "$remote_main_ref" != "$expected_main_ref" ]]; then
            printf '%s\n' 'DEPLOY_REMOTE_MAIN_REVISION_MISMATCH' >&2
            exit 1
          fi
      - name: Deploy locked Wrangler build
        run: npm exec -- wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production homepage and health
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 --output /dev/null https://threads.pylot.dev/
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 --output /dev/null https://threads.pylot.dev/api/health
